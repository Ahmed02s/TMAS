name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Run TMAS staging database security test
        env:
          TMAS_TEST_ENV: staging
          TEST_SUPABASE_URL: https://tmibummobsgixleyabit.supabase.co
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pytest -q tests/integration/test_staging_database.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  api-security-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - name: Start API without external credentials
        working-directory: backend
        env:
          JWT_SECRET: ci-only-not-a-production-secret-ci-only
          APP_ENV: test
        run: uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/tmas-api.log 2>&1 &
      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/tmas-api.log
          exit 1
      - run: npm run test:e2e
